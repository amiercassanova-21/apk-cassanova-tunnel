name: Build Cassanova Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cassanova-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: dnstt/go.mod
        cache-dependency-path: dnstt/go.sum

    - name: Build dnstt client (SlowDNS, arm64-v8a)
      run: |
        mkdir -p V2rayNG/app/libs/arm64-v8a
        cd dnstt
        CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
        CC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang \
          go build -trimpath -ldflags "-s -w" \
          -o ../V2rayNG/app/libs/arm64-v8a/libdnstt.so ./dnstt-client
        file ../V2rayNG/app/libs/arm64-v8a/libdnstt.so

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    # Signing key: repository secrets when set (stable across builds); otherwise a key kept in
    # the Actions cache so consecutive builds can update each other.
    - name: Restore fallback keystore
      id: ks-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/fallback.jks
        key: cassanova-fallback-keystore-v1

    - name: Prepare signing
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KS_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        if [ -n "$KS_B64" ]; then
          echo "$KS_B64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "SIGN_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          echo "SIGN_STORE_PASS=$KS_PASS" >> $GITHUB_ENV
          echo "SIGN_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          echo "SIGN_KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "SIGN_SOURCE=secrets" >> $GITHUB_ENV
        else
          if [ ! -f $RUNNER_TEMP/fallback.jks ]; then
            keytool -genkeypair -v -keystore $RUNNER_TEMP/fallback.jks -storepass cassanova -keypass cassanova \
              -alias cassanova -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Cassanova Tunnel"
          fi
          echo "SIGN_FILE=$RUNNER_TEMP/fallback.jks" >> $GITHUB_ENV
          echo "SIGN_STORE_PASS=cassanova" >> $GITHUB_ENV
          echo "SIGN_ALIAS=cassanova" >> $GITHUB_ENV
          echo "SIGN_KEY_PASS=cassanova" >> $GITHUB_ENV
          echo "SIGN_SOURCE=fallback" >> $GITHUB_ENV
        fi

    - name: Save fallback keystore
      if: ${{ env.SIGN_SOURCE == 'fallback' && steps.ks-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/fallback.jks
        key: cassanova-fallback-keystore-v1

    - name: Unit tests
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest

    - name: Build APK
      run: |
        cd V2rayNG
        ./gradlew :app:assemblePlaystoreRelease -PABI_FILTERS=arm64-v8a \
          -Pandroid.injected.signing.store.file=$SIGN_FILE \
          -Pandroid.injected.signing.store.password=$SIGN_STORE_PASS \
          -Pandroid.injected.signing.key.alias=$SIGN_ALIAS \
          -Pandroid.injected.signing.key.password=$SIGN_KEY_PASS

    - name: Verify APK contents
      run: |
        APK=$(ls V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk)
        echo "APK=$APK" >> $GITHUB_ENV
        unzip -l "$APK" | grep -E "lib/arm64-v8a/(libdnstt|libhev-socks5-tunnel|libhevsockstun|libgojni)\.so"
        for f in libdnstt libhev-socks5-tunnel libhevsockstun libgojni; do
          unzip -l "$APK" | grep -q "lib/arm64-v8a/$f.so" || { echo "missing $f.so"; exit 1; }
        done
        $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs "$APK" | head -5
        $ANDROID_HOME/build-tools/37.0.0/aapt2 dump badging "$APK" | grep -E "^package|application-label:"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: cassanova-tunnel-arm64-v8a
        path: ${{ env.APK }}

    - name: Publish pre-release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="build-${{ github.run_number }}"
        gh release create "$TAG" "$APK" --prerelease --target "${{ github.sha }}" \
          --title "Cassanova Tunnel build ${{ github.run_number }}" \
          --notes "Automatic build of ${{ github.sha }} (arm64-v8a, signed with ${SIGN_SOURCE} key)."
