name: Build Amier VPN

on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: 'Bangun ulang semua aplikasi (abaikan deteksi perubahan)'
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cassanova-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    # Each app keeps its own build number: only an app whose files changed since its last build is
    # rebuilt (as build N); the others are re-published unchanged from the latest release, so every
    # release still carries all three apps. Path lists are deliberately broad.
    - name: Plan release (which apps changed)
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE: ${{ github.event.inputs.rebuild_all }}
      run: |
        gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name, .assets[].name' > "$RUNNER_TEMP/latest.txt" 2>/dev/null || : > "$RUNNER_TEMP/latest.txt"
        PREV_TAG=$(head -1 "$RUNNER_TEMP/latest.txt")
        echo "PREV_TAG=$PREV_TAG" >> $GITHUB_ENV
        COMMON=(V2rayNG/app ':(exclude)V2rayNG/app/src/lite' ':(exclude)V2rayNG/app/src/fdroid' ':(exclude)V2rayNG/app/src/test'
                V2rayNG/build.gradle.kts V2rayNG/settings.gradle.kts V2rayNG/gradle V2rayNG/gradle.properties
                AndroidLibXrayLite patches hev-socks5-tunnel compile-hevtun.sh .github/workflows/cassanova-build.yml)
        # decide KEY FILE-REGEX PATHSPEC... -> KEY_BUILD=true, or KEY_BUILD=false and KEY_KEEP=<old N>
        decide() {
          key=$1; re=$2; shift 2
          file=$(tail -n +2 "$RUNNER_TEMP/latest.txt" | grep -E "$re" | head -1 || true)
          old=$(printf '%s' "$file" | sed -n 's/.*-b\([0-9][0-9]*\)_.*/\1/p')
          if [ "$FORCE" = "true" ] || [ -z "$old" ] || ! git rev-parse -q --verify "refs/tags/build-$old" >/dev/null; then
            echo "${key}_BUILD=true" >> $GITHUB_ENV; echo "$key: build (no earlier build to compare)"
          elif git diff --quiet "build-$old" HEAD -- "$@"; then
            echo "${key}_BUILD=false" >> $GITHUB_ENV; echo "${key}_KEEP=$old" >> $GITHUB_ENV; echo "$key: unchanged since build-$old"
          else
            echo "${key}_BUILD=true" >> $GITHUB_ENV; echo "$key: changed since build-$old:"
            git diff --name-only "build-$old" HEAD -- "$@" | head -20 || true
          fi
        }
        decide MAIN '^AmierVPN_[0-9]' "${COMMON[@]}" dnstt cassh
        decide LITE '^AmierVPN_Lite_' "${COMMON[@]}" V2rayNG/app/src/lite tools/geotrim.py
        decide TETHER '^AmierTether_' V2rayNG/tether ':(exclude)V2rayNG/tether/src/test' \
          V2rayNG/build.gradle.kts V2rayNG/settings.gradle.kts V2rayNG/gradle V2rayNG/gradle.properties \
          hev-socks5-tunnel compile-hevtun.sh .github/workflows/cassanova-build.yml
        # Nothing changed for any app (e.g. only docs): no new release.
        if ! grep -q '_BUILD=true' $GITHUB_ENV; then
          echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          echo "::notice::Tidak ada aplikasi yang berubah sejak $PREV_TAG; rilis baru tidak dibuat."
        fi

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: AndroidLibXrayLite/go.mod
        cache-dependency-path: |
          AndroidLibXrayLite/go.sum
          dnstt/go.sum
          cassh/go.mod

    # libv2ray.aar is built here (not downloaded) so the Xray-core patches in patches/ apply:
    # xray-core-allow-plaintext.patch re-allows VLESS/Trojan without TLS (port 80).
    - name: Restore cached libv2ray
      id: cache-libv2ray
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar
        key: libv2ray-arm64-armv7-${{ hashFiles('.git/modules/AndroidLibXrayLite/HEAD') }}-${{ hashFiles('patches/xray-core-*.patch') }}

    - name: Build libv2ray (patched Xray-core, arm64-v8a + armeabi-v7a)
      if: steps.cache-libv2ray.outputs.cache-hit != 'true'
      env:
        ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
      run: |
        cd AndroidLibXrayLite
        go mod download github.com/xtls/xray-core
        SRC=$(go list -m -f '{{.Dir}}' github.com/xtls/xray-core)
        echo "Xray-core: $(go list -m -f '{{.Version}}' github.com/xtls/xray-core)"
        cp -r "$SRC" "$RUNNER_TEMP/xray-core"
        chmod -R u+w "$RUNNER_TEMP/xray-core"
        for p in ../patches/xray-core-*.patch; do patch -d "$RUNNER_TEMP/xray-core" -p1 --forward < "$p"; done
        go mod edit -replace github.com/xtls/xray-core="$RUNNER_TEMP/xray-core"
        mkdir -p assets data
        bash gen_assets.sh download
        cp -v data/*.dat assets/
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init
        go mod tidy
        mkdir -p ../V2rayNG/app/libs
        gomobile bind -v -target android/arm64,android/arm -androidapi 24 -trimpath \
          -ldflags='-s -w -buildid= -checklinkname=0' -o ../V2rayNG/app/libs/libv2ray.aar ./
        rm -f ../V2rayNG/app/libs/libv2ray-sources.jar

    - name: Save libv2ray
      if: steps.cache-libv2ray.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar
        key: libv2ray-arm64-armv7-${{ hashFiles('.git/modules/AndroidLibXrayLite/HEAD') }}-${{ hashFiles('patches/xray-core-*.patch') }}

    - name: Build dnstt client (SlowDNS, arm64-v8a + armeabi-v7a)
      run: |
        TC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
        cd dnstt
        mkdir -p ../V2rayNG/app/libs/arm64-v8a ../V2rayNG/app/libs/armeabi-v7a
        CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$TC/aarch64-linux-android24-clang \
          go build -trimpath -ldflags "-s -w" -o ../V2rayNG/app/libs/arm64-v8a/libdnstt.so ./dnstt-client
        CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC=$TC/armv7a-linux-androideabi24-clang \
          go build -trimpath -ldflags "-s -w" -o ../V2rayNG/app/libs/armeabi-v7a/libdnstt.so ./dnstt-client
        file ../V2rayNG/app/libs/*/libdnstt.so

    - name: Build native SSH engine (cassh, arm64-v8a + armeabi-v7a)
      run: |
        TC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
        cd cassh
        go mod tidy
        go vet ./...
        go test -count=1 -timeout 120s ./...
        CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$TC/aarch64-linux-android24-clang \
          go build -trimpath -ldflags "-s -w" -o ../V2rayNG/app/libs/arm64-v8a/libcassh.so .
        CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC=$TC/armv7a-linux-androideabi24-clang \
          go build -trimpath -ldflags "-s -w" -o ../V2rayNG/app/libs/armeabi-v7a/libcassh.so .
        file ../V2rayNG/app/libs/*/libcassh.so

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    # Signing key: repository secrets only. Without them the build fails instead of signing with a
    # throwaway key, so every published APK can update the previous one and nobody else's can.
    - name: Prepare signing
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KS_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        if [ -z "$KS_B64" ]; then
          echo "::error::Signing secret APP_KEYSTORE_BASE64 is not set; refusing to build an unsigned or throwaway-signed release."
          exit 1
        fi
        echo "$KS_B64" | base64 -d > $RUNNER_TEMP/release.jks
        echo "SIGN_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
        echo "SIGN_STORE_PASS=$KS_PASS" >> $GITHUB_ENV
        echo "SIGN_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
        echo "SIGN_KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
        # Locked-config key: derived from the keystore password, stable across builds.
        LOCK_KEY=$(printf 'cassanova-lock-v1:%s' "$KS_PASS" | sha256sum | cut -d' ' -f1)
        echo "::add-mask::$LOCK_KEY"
        echo "LOCK_KEY=$LOCK_KEY" >> $GITHUB_ENV

    - name: Unit tests
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest :tether:testDebugUnitTest

    - name: Build APK
      run: |
        cd V2rayNG
        SIGN="-Pandroid.injected.signing.store.file=$SIGN_FILE -Pandroid.injected.signing.store.password=$SIGN_STORE_PASS -Pandroid.injected.signing.key.alias=$SIGN_ALIAS -Pandroid.injected.signing.key.password=$SIGN_KEY_PASS"
        if [ "$MAIN_BUILD" = "true" ]; then
          ./gradlew :app:assemblePlaystoreRelease "-PABI_FILTERS=arm64-v8a;armeabi-v7a" $SIGN \
            -PcassanovaLockKey=$LOCK_KEY \
            -PcassanovaBuild=${{ github.run_number }}
        fi
        if [ "$LITE_BUILD" = "true" ]; then
          # Amier VPN Lite: slim build (R8, Indonesian + English only) with trimmed routing data:
          # only the categories its presets and DNS settings use (see tools/geotrim.py).
          mkdir -p app/src/lite/assets
          unzip -o -j app/libs/libv2ray.aar assets/geoip.dat assets/geosite.dat -d $RUNNER_TEMP/geo
          python3 ../tools/geotrim.py $RUNNER_TEMP/geo/geoip.dat app/src/lite/assets/geoip.dat private id cn
          python3 ../tools/geotrim.py $RUNNER_TEMP/geo/geosite.dat app/src/lite/assets/geosite.dat private cn google category-ads-all
          ./gradlew :app:assembleLiteRelease "-PABI_FILTERS=arm64-v8a;armeabi-v7a" $SIGN \
            -PcassanovaSlim=true \
            -PcassanovaLockKey=$LOCK_KEY \
            -PcassanovaBuild=${{ github.run_number }}
        fi
        if [ "$TETHER_BUILD" = "true" ]; then
          # Amier Tether: the small client for the phone that joins the hotspot.
          ./gradlew :tether:assembleRelease "-PABI_FILTERS=arm64-v8a;armeabi-v7a" $SIGN \
            -PcassanovaBuild=${{ github.run_number }}
        fi

    - name: Verify APK contents
      run: |
        OUT=V2rayNG/app/build/outputs/apk/playstore/release
        check() { # apk abi...
          apk=$1; shift
          for abi in "$@"; do
            for f in libdnstt libcassh libhev-socks5-tunnel libhevsockstun libgojni; do
              unzip -l "$apk" | grep -q "lib/$abi/$f.so" || { echo "missing $abi/$f.so in $apk"; exit 1; }
            done
          done
          for f in geoip.dat geosite.dat geoip-only-cn-private.dat; do
            unzip -l "$apk" | grep -q "assets/$f" || { echo "missing assets/$f in $apk"; exit 1; }
          done
          unzip -l "$apk" | grep "lib/" | awk '{print $1, $4}'
          $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs "$apk" | grep "SHA-256"
          $ANDROID_HOME/build-tools/37.0.0/aapt2 dump badging "$apk" | grep -E "^package|application-label:|native-code"
          ls -la "$apk"
        }
        if [ "$MAIN_BUILD" = "true" ]; then
          check $OUT/*_arm64-v8a.apk arm64-v8a
          check $OUT/*_armeabi-v7a.apk armeabi-v7a
          check $OUT/*_universal.apk arm64-v8a armeabi-v7a
        fi

        # Amier VPN Lite: Xray engine and tun2socks present, SSH/SlowDNS engines absent; two files only.
        LITE=V2rayNG/app/build/outputs/apk/lite/release
        rm -f $LITE/*_universal.apk
        [ "$LITE_BUILD" = "true" ] && for abi in arm64-v8a armeabi-v7a; do
          apk=$(ls $LITE/AmierVPN_Lite_*_$abi.apk)
          for f in libgojni libhev-socks5-tunnel libhevsockstun; do
            unzip -l "$apk" | grep -q "lib/$abi/$f.so" || { echo "missing $abi/$f.so in $apk"; exit 1; }
          done
          for f in libcassh libdnstt; do
            if unzip -l "$apk" | grep -q "lib/$abi/$f.so"; then echo "$f.so must not be in $apk"; exit 1; fi
          done
          $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs "$apk" | grep "SHA-256"
          $ANDROID_HOME/build-tools/37.0.0/aapt2 dump badging "$apk" | grep -E "^package|application-label:|native-code"
          ls -la "$apk"
        done

        # Amier Tether: only hev-socks5-tunnel, nothing of the VPN engines.
        TETHER=V2rayNG/tether/build/outputs/apk/release
        [ "$TETHER_BUILD" = "true" ] && for abi in arm64-v8a armeabi-v7a; do
          apk=$(ls $TETHER/AmierTether_*_$abi.apk)
          unzip -l "$apk" | grep -q "lib/$abi/libhev-socks5-tunnel.so" || { echo "missing hev in $apk"; exit 1; }
          for f in libgojni libcassh libdnstt libhevsockstun; do
            if unzip -l "$apk" | grep -q "lib/$abi/$f.so"; then echo "$f.so must not be in $apk"; exit 1; fi
          done
          $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs "$apk" | grep "SHA-256"
          $ANDROID_HOME/build-tools/37.0.0/aapt2 dump badging "$apk" | grep -E "^package|application-label:|native-code"
          ls -la "$apk"
        done
        true

    # Unchanged apps: the files of their last build, byte for byte, from the latest release.
    - name: Reuse unchanged apps
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        OUT=V2rayNG/app/build/outputs/apk/playstore/release
        LITE=V2rayNG/app/build/outputs/apk/lite/release
        TETHER=V2rayNG/tether/build/outputs/apk/release
        mkdir -p $OUT $LITE $TETHER
        [ "$MAIN_BUILD" = "true" ] || gh release download "$PREV_TAG" -R "${{ github.repository }}" -D $OUT -p "AmierVPN_*-b${MAIN_KEEP}_*.apk"
        rm -f $OUT/AmierVPN_Lite_*.apk
        [ "$LITE_BUILD" = "true" ] || gh release download "$PREV_TAG" -R "${{ github.repository }}" -D $LITE -p "AmierVPN_Lite_*-b${LITE_KEEP}_*.apk"
        [ "$TETHER_BUILD" = "true" ] || gh release download "$PREV_TAG" -R "${{ github.repository }}" -D $TETHER -p "AmierTether_*-b${TETHER_KEEP}_*.apk"
        for d in $OUT $LITE $TETHER; do
          n=$(ls $d/*.apk 2>/dev/null | wc -l)
          [ "$n" -ge 2 ] || { echo "::error::$d has $n APK files"; exit 1; }
          ls -la $d
        done

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: amier-vpn-apks
        path: |
          V2rayNG/app/build/outputs/apk/playstore/release/*.apk
          V2rayNG/app/build/outputs/apk/lite/release/*.apk
          V2rayNG/tether/build/outputs/apk/release/*.apk

    - name: Publish release
      if: env.SKIP_RELEASE != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="build-${{ github.run_number }}"
        OUT=V2rayNG/app/build/outputs/apk/playstore/release
        LITE=V2rayNG/app/build/outputs/apk/lite/release
        TETHER=V2rayNG/tether/build/outputs/apk/release
        VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' V2rayNG/app/build.gradle.kts | head -1)
        PREV=$(git tag -l 'build-*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
        # "Amier VPN 1.1.0-b33 (baru)" or "(tidak berubah, sama dengan build-31)" from the file names.
        status() { # label dir file-regex built
          f=$(ls "$2" | grep -E "$3" | head -1 || true)
          v=$(printf '%s' "$f" | sed -n 's/^[A-Za-z_]*_\([0-9.]*-b[0-9]*\)_.*/\1/p')
          b=$(printf '%s' "$v" | sed -n 's/.*-b//p')
          if [ "$4" = "true" ]; then echo "- **$1 $v**: baru"; else echo "- **$1 $v**: tidak berubah (sama dengan build-$b)"; fi
        }
        {
          echo "## Amier VPN $VERSION (build ${{ github.run_number }})"
          echo
          echo "### Versi aplikasi"
          status "Amier VPN" $OUT '^AmierVPN_[0-9]' "$MAIN_BUILD"
          status "Amier VPN Lite" $LITE '^AmierVPN_Lite_' "$LITE_BUILD"
          status "Amier Tether" $TETHER '^AmierTether_' "$TETHER_BUILD"
          echo
          if [ -n "$PREV" ]; then
            echo "### Perubahan sejak $PREV"
            git log --no-merges --format='- %s' "$PREV..${{ github.sha }}"
          else
            echo "### Perubahan"
            git log --no-merges -n 10 --format='- %s' "${{ github.sha }}"
          fi
          echo
          echo "### Pilih file"
          echo "- **arm64-v8a**: hampir semua HP Android sekarang (64-bit). Pilih ini kalau ragu."
          echo "- **armeabi-v7a**: HP lama 32-bit."
          echo "- **universal**: berjalan di semua HP, ukurannya lebih besar."
          echo
          echo "### Amier VPN Lite"
          echo "Versi ringan: hanya VLESS, VMess, Trojan, dan Hysteria2 (tanpa SSH/SlowDNS). Bisa dipasang berdampingan dengan Amier VPN."
          echo "- **AmierVPN_Lite_…arm64-v8a**: hampir semua HP Android sekarang."
          echo "- **AmierVPN_Lite_…armeabi-v7a**: HP lama 32-bit."
          echo
          echo "### Amier Tether"
          echo "Untuk HP kedua yang tersambung ke hotspot HP utama: semua lalu lintasnya lewat proxy SOCKS5 HP utama (Proxy Tethering Amier VPN atau aplikasi tunnel lain). IP dan port terdeteksi otomatis."
          echo "- **AmierTether_…arm64-v8a**: hampir semua HP Android sekarang."
          echo "- **AmierTether_…armeabi-v7a**: HP lama 32-bit."
          echo
          echo "### SHA-256"
          echo '```'
          (cd $OUT && sha256sum *.apk)
          (cd $LITE && sha256sum *.apk)
          (cd $TETHER && sha256sum *.apk)
          echo '```'
        } > "$RUNNER_TEMP/notes.md"
        # Main files first, Lite below.
        gh release create "$TAG" $OUT/*.apk $LITE/*.apk $TETHER/*.apk \
          --latest --target "${{ github.sha }}" \
          --title "Amier VPN $VERSION (build ${{ github.run_number }})" \
          --notes-file "$RUNNER_TEMP/notes.md"
